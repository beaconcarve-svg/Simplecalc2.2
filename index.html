<!DOCTYPE html>
<html>
<head>
  <title>Area Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      text-align: center;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      text-align: left;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
    }
    .result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h2>Engraving Area Calculator</h2>

  <label for="width">Width (cm):</label>
  <input type="number" id="width" min="0" step="0.1">

  <label for="height">Height (cm):</label>
  <input type="number" id="height" min="0" step="0.1">

  <div class="result">
    Area: <span id="area">0</span> cm²
  </div>

  <div id="buttons">
    <button onclick="copyArea()">Copy Area</button>
    <a href="https://tally.so/r/wdMQ9r" target="_blank">
      <button>➡Continue to Order Form</button>
    </a>
  </div>

  <script>
    const widthInput = document.getElementById('width');
    const heightInput = document.getElementById('height');
    const areaDisplay = document.getElementById('area');

    function updateArea() {
      const width = parseFloat(widthInput.value) || 0;
      const height = parseFloat(heightInput.value) || 0;
      const area = width * height;
      areaDisplay.textContent = area.toFixed(2);
    }

    function copyArea() {
      const area = areaDisplay.textContent;
      navigator.clipboard.writeText(area)
        .then(() => alert('Area copied to clipboard!'))
        .catch(() => alert('Failed to copy.'));
    }

    widthInput.addEventListener('input', updateArea);
    heightInput.addEventListener('input', updateArea);
  </script>

</body>
</html>
